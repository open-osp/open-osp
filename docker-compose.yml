
services:

    db:
      restart: 'always'
      image: mariadb:10.5
      command: 'mysqld --character-set-server=utf8 --collation-server=utf8_general_ci'
      working_dir: /code
      env_file:
        - local.env
      environment:
        MYSQL_DATABASE: drugref2
        MYSQL_USER: oscar
        TZ: America/Vancouver
      volumes:
        # TODO: build this in to the image.
        - ./docker/db/my.cnf:/etc/mysql/my.cnf
        # TODO: build some scripts in so we need not mount everything.
        - .:/code
        - mariadb-files:/var/lib/mysql
        # Ensure that the database uses the host's system timezone
        - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
        - ./docker/health/health.sh:/health.sh:ro
      networks:
        - back-tier
      healthcheck:
        test: ["CMD", "sh", "/health.sh", "db", "localhost"]
        interval: 10s
        timeout: 15s
        retries: 6
        start_period: 30s
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 15G

    oscar:
      restart: 'always'
      image: openosp/open-osp:latest
      build: docker/oscar
      volumes:
        - ./volumes/oscar.properties:/root/oscar.properties
        - ./volumes/drugref2.properties:/root/drugref2.properties
        - ./volumes/OscarDocument:/var/lib/OscarDocument
        - ./volumes/ssl.crt:/usr/local/tomcat/conf/ssl.crt
        - ./volumes/ssl.key:/usr/local/tomcat/conf/ssl.key
        - ./volumes/chain.pem:/usr/local/tomcat/conf/chain.pem
        - ./docker/health/health.sh:/health.sh:ro
        # Add other volumes to the volumes/ folder, and mount them via docker-compose.override.yml
      networks:
        - back-tier
      depends_on:
        db:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "sh", "/health.sh", "oscar", "localhost"]
        interval: 30s
        timeout: 25s
        retries: 5
        start_period: 300s
      environment:
        TZ: America/Vancouver
        CATALINA_OPTS: -Djava.awt.headless=true
        JAVA_OPTS: -Dlog4j2.formatMsgNoLookups=true -XX:+UseG1GC -Xmx2G -Xms2G -Dorg.apache.el.parser.COERCE_TO_ZERO=true
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 15G

    expedius:
      restart: 'always'
      image: openosp/expedius:latest
      build: docker/expedius
      volumes:
        - ./volumes/ssl.crt:/usr/local/tomcat/conf/ssl.crt
        - ./volumes/ssl.key:/usr/local/tomcat/conf/ssl.key
        - ./volumes/expedius:/var/lib/expedius
        - ./volumes/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
        - ./docker/health/health.sh:/health.sh:ro
      networks:
        - back-tier
      depends_on:
        oscar:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "sh", "/health.sh", "expedius", "localhost"]
        interval: 30s
        timeout: 15s
        retries: 5
        start_period: 180s
      environment:
        TZ: America/Vancouver
        JAVA_OPTS: -Dlog4j2.formatMsgNoLookups=true
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 4G

    faxws:
      restart: 'always'
      image: openosp/faxws:latest
      build: docker/faxws
      volumes:
        - ./volumes/OscarDocument:/var/lib/OscarDocument
        - ./volumes/ssl.crt:/usr/local/tomcat/conf/ssl.crt
        - ./volumes/ssl.key:/usr/local/tomcat/conf/ssl.key
        - ./docker/health/health.sh:/health.sh:ro
      networks:
        - back-tier
      depends_on:
        oscar:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "sh", "/health.sh", "faxws", "localhost"]
        interval: 30s
        timeout: 15s
        retries: 5
        start_period: 180s
      env_file:
        - local.env
      environment:
        TZ: America/Vancouver
        MYSQL_HOST: db
        JAVA_OPTS: -Dlog4j2.formatMsgNoLookups=true
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 4G

volumes:
  mariadb-files:
    driver: local

networks:
  back-tier:
    driver: bridge
