services:
    health:
      build: docker/health
      volumes:
        - ./docker/health/health.sh:/health.sh:ro
      networks:
        - back-tier
      env_file:
        - local.env

    cpcssn:
      image: osp-extract-linux-container
      env_file: local.env
      environment:
        - CPCSSN_DRY_RUN=true
#        - CPCSSN_SITE=
#        - MYSQL_USER=
#        - MYSQL_PASSWORD=
      networks:
        - back-tier

networks:
  back-tier:
    driver: bridge

